                          IamInstanceProfile={'Name': iam_profile},
                          UserData=user_data,
                          # Encrypt the root volume so captured pcap files written to
                          # disk are encrypted at rest with the account's EBS default
                          # (or AWS-managed) key.
                          BlockDeviceMappings=[{
                              'DeviceName': '/dev/xvda',
                              'Ebs': {
                                  'Encrypted': True,
                                  'DeleteOnTermination': True,
                                  'VolumeType': 'gp3'
                              }
                          }],
                          # Require IMDSv2 (token-backed) and disable IMDSv1.
                          MetadataOptions={
                              'HttpTokens': 'required',
                              'HttpEndpoint': 'enabled',
                              'HttpPutResponseHopLimit': 1
                          },
                          TagSpecifications=[
                              {
                                  'ResourceType': 'instance',
                                  'Tags': [
                                      {'Key': 'Name', 'Value': f'{stack_name}-MirrorTarget-{expected_source_server[-8:]}'},
                                      {'Key': 'MirrorTarget', 'Value': 'true'},
                                      {'Key': 'StackName', 'Value': stack_name},
                                      {'Key': 'StackId', 'Value': stack_id},
                                      {'Key': 'SourceServerId', 'Value': expected_source_server},
                                      {'Key': 'ReplicationServerId', 'Value': instance_id}
                                  ]
                              },
                              {
                                  'ResourceType': 'network-interface',
                                  'Tags': [
                                      {'Key': 'StackName', 'Value': stack_name},
                                      {'Key': 'StackId', 'Value': stack_id},
                                      {'Key': 'SourceServerId', 'Value': expected_source_server},
