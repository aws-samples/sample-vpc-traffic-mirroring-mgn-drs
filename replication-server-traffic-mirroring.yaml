                              'Tags': [
                                  {'Key': 'Name', 'Value': f'{stack_name}-Target-{expected_source_server[-8:]}'},
                                  {'Key': 'StackName', 'Value': stack_name},
                                  {'Key': 'StackId', 'Value': stack_id},
                                  {'Key': 'SourceServerId', 'Value': expected_source_server},
                                  {'Key': 'ReplicationServerId', 'Value': instance_id}
                              ]
                          }]
                      )
                      mirror_target = response['TrafficMirrorTarget']
                      created_this_attempt.append(
                          ('traffic-mirror-target', mirror_target['TrafficMirrorTargetId']))
                  mirror_target_id = mirror_target['TrafficMirrorTargetId']
                  inventory_record['MirrorTargetId'] = mirror_target_id
                  inventory_record['TargetNetworkInterfaceId'] = target_details['network_interface_id']
                  save_inventory(inventory_parameter, inventory_document)
                  
                  # Create or reuse the exact owned mirror filter and verify
                  # that its accept rules equal the selected capture scope.
                  mirror_filter = find_mirror_filter(
                      inventory_record.get('MirrorFilterId'), stack_id,
                      expected_source_server, instance_id)
                  if not mirror_filter:
                      ensure_active(inventory_parameter)
                      require_time(context, 60, 'MirrorFilterCreation')
                      response = ec2.create_traffic_mirror_filter(
                          Description=f'Mirror filter for {expected_source_server}',
                          TagSpecifications=[{
                              'ResourceType': 'traffic-mirror-filter',
                              'Tags': [
                                  {'Key': 'Name', 'Value': f'{stack_name}-Filter-{expected_source_server[-8:]}'},
                                  {'Key': 'StackName', 'Value': stack_name},
                                  {'Key': 'StackId', 'Value': stack_id},
                                  {'Key': 'SourceServerId', 'Value': expected_source_server},
                                  {'Key': 'ReplicationServerId', 'Value': instance_id}
                              ]
                          }]
                      )
                      mirror_filter = response['TrafficMirrorFilter']
                      created_this_attempt.append(
                          ('traffic-mirror-filter', mirror_filter['TrafficMirrorFilterId']))
                  mirror_filter = ensure_filter_rules(mirror_filter)
                  filter_id = mirror_filter['TrafficMirrorFilterId']
                  inventory_record['MirrorFilterId'] = filter_id
                  inventory_record['FilterScope'] = 'AllIPv4'
                  save_inventory(inventory_parameter, inventory_document)
                  
                  # Create or reuse the exact owned mirror session.
                  mirror_session = find_mirror_session(
                      inventory_record.get('MirrorSessionId'), stack_id,
                      expected_source_server, instance_id,
                      rs_details['network_interface_id'], mirror_target_id,
                      filter_id)
                  if not mirror_session:
                      ensure_active(inventory_parameter)
                      require_time(context, 60, 'MirrorSessionCreation')
                      response = ec2.create_traffic_mirror_session(
                          NetworkInterfaceId=rs_details['network_interface_id'],
                          TrafficMirrorTargetId=mirror_target_id,
                          TrafficMirrorFilterId=filter_id,
                          SessionNumber=next_available_session_number(
                              rs_details['network_interface_id']),
                          Description=f'Mirror session for {expected_source_server}',
                          TagSpecifications=[{
                              'ResourceType': 'traffic-mirror-session',
                              'Tags': [
                                  {'Key': 'Name', 'Value': f'{stack_name}-Session-{expected_source_server[-8:]}'},
                                  {'Key': 'StackName', 'Value': stack_name},
                                  {'Key': 'StackId', 'Value': stack_id},
                                  {'Key': 'SourceServerId', 'Value': expected_source_server},
                                  {'Key': 'ReplicationServerId', 'Value': instance_id}
                              ]
                          }]
                      )
                      mirror_session = response['TrafficMirrorSession']
                      created_this_attempt.append(
                          ('traffic-mirror-session', mirror_session['TrafficMirrorSessionId']))
                  inventory_record['MirrorSessionId'] = mirror_session['TrafficMirrorSessionId']
                  save_inventory(inventory_parameter, inventory_document)
                  
                  result = {
                      'message': 'Traffic mirroring configured successfully!',
                      'sourceServerId': expected_source_server,
                      'replicationServerId': instance_id,
                      'mirrorTargetInstanceId': target_instance_id,
                      'mirrorTargetId': mirror_target_id,
                      'mirrorFilterId': filter_id,
                      'mirrorSessionId': mirror_session['TrafficMirrorSessionId']
                  }
                  
                  logger.info("Mirroring setup succeeded source=%s replicationServer=%s session=%s",
                              expected_source_server, instance_id,
                              mirror_session['TrafficMirrorSessionId'])
                  clear_active_invocation(
                      inventory_parameter, context.aws_request_id)
                  return {'statusCode': 200, 'body': json.dumps(result)}
                  
              except StackDeletingError:
                  rollback_failures = []
                  if created_this_attempt and inventory_record is not None:
                      rollback_failures = rollback_created(
                          created_this_attempt, inventory_record,
                          inventory_document, inventory_parameter, context)
                  if inventory_document is not None:
                      try:
                          clear_active_invocation(
                              inventory_parameter, context.aws_request_id)
                      except Exception as clear_error:
                          details = safe_error(clear_error)
                          rollback_failures.append({
                              'Kind': 'active-invocation-marker',
                              'Error': details
                          })
                          logger.error(
                              "Active invocation marker clear failed details=%s",
                              details)
                  if rollback_failures:
                      failure = {
                          'Type': 'RollbackError',
                          'Code': 'RollbackIncomplete',
                          'Operation': 'rollback',
                          'FailureCount': len(rollback_failures)
                      }
                      logger.error(
                          "Setup observed DELETING but rollback was incomplete "
                          "details=%s", failure)
                      raise RuntimeError(
                          json.dumps(failure, sort_keys=True)) from None
                  logger.info("Stack lifecycle is DELETING; setup stopped")
                  return {'statusCode': 200, 'body': 'Stack deleting'}
              except Exception as e:
                  rollback_failures = []
                  if created_this_attempt and inventory_record is not None:
                      rollback_failures = rollback_created(
                          created_this_attempt, inventory_record,
                          inventory_document, inventory_parameter, context)
                  if inventory_document is not None:
                      try:
                          clear_active_invocation(
                              inventory_parameter, context.aws_request_id)
                      except Exception as clear_error:
                          clear_details = safe_error(clear_error)
                          rollback_failures.append({
                              'Kind': 'active-invocation-marker',
                              'Error': clear_details
                          })
                          logger.error(
                              "Active invocation marker clear failed details=%s",
                              clear_details)
                  # Re-raise so EventBridge treats this async invocation as failed
                  # and retries. If rollback was incomplete, surface that fact
                  # after all reverse-order attempts without logging resource IDs
                  # in the raised error payload. Exact IDs remain in inventory.
                  details = safe_error(e)
                  if rollback_failures:
                      details['Rollback'] = {
                          'Code': 'RollbackIncomplete',
                          'FailureCount': len(rollback_failures)
                      }
                  logger.error("Mirroring setup failed requestId=%s details=%s",
                               context.aws_request_id, details)
                  raise RuntimeError(json.dumps(details, sort_keys=True)) from None

  #============================================================================
  # STEP 5: Cleanup Lambda - Delete mirroring resources on stack deletion
  #============================================================================
  
  CleanupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-Cleanup"
      RetentionInDays: 14

  CleanupFunction:
    Type: AWS::Lambda::Function
    DependsOn: CleanupLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-Cleanup"
      Description: "Cleans up traffic mirroring resources on stack deletion"
      Handler: index.handler
      Role: !GetAtt CleanupExecutionRole.Arn
      Runtime: python3.11
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          SOURCE_SERVER_ID: !Ref SourceServerId
          STACK_ID: !Ref AWS::StackId
          INVENTORY_PARAMETER: !Ref MirroringInventoryParameter
          LIFECYCLE_PARAMETER: !Ref MirroringLifecycleParameter
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import contextlib
          import io

          _cfnresponse_send = cfnresponse.send

          def quiet_cfnresponse_send(*args, **kwargs):
              # The runtime helper prints the complete CloudFormation response
              # body. Preserve its delivery behavior while discarding that
              # unnecessary infrastructure metadata from Lambda logs.
              with contextlib.redirect_stdout(io.StringIO()):
                  with contextlib.redirect_stderr(io.StringIO()):
                      return _cfnresponse_send(*args, **kwargs)

          cfnresponse.send = quiet_cfnresponse_send
          import json
          import logging
          import time

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          ec2 = boto3.client('ec2')
          ssm = boto3.client('ssm')

          def error_code(error):
              response = getattr(error, 'response', {}) or {}
              return (response.get('Error', {}) or {}).get('Code', '')

          def is_not_found(error):
              return 'NotFound' in error_code(error)

          def safe_error(error):
              return f"{type(error).__name__}:{error_code(error) or 'UnhandledError'}:{getattr(error, 'operation_name', 'unknown')}"

          def release_source_lock(parameter_name, stack_id):
              try:
                  current = ssm.get_parameter(Name=parameter_name)
              except Exception as error:
                  if error_code(error) == 'ParameterNotFound':
                      return
                  raise
              if current['Parameter'].get('Value') == stack_id:
                  ssm.delete_parameter(Name=parameter_name)

          def tags_dict(resource):
              return {tag['Key']: tag['Value'] for tag in resource.get('Tags', [])}

          def verify_owned(resource, stack_id, source_server_id,
                           replication_server_id, label):
              tags = tags_dict(resource)
              expected = {
                  'StackId': stack_id,
                  'SourceServerId': source_server_id,
                  'ReplicationServerId': replication_server_id
              }
              if any(tags.get(key) != value for key, value in expected.items()):
                  raise ValueError(f"OwnershipMismatch:{label}")

          def load_inventory(parameter_name, stack_id, source_server_id):
              response = ssm.get_parameter(Name=parameter_name)
              raw = response['Parameter'].get('Value', '{}')
              document = json.loads(raw) if raw else {}
              if not document:
                  return {'Version': 1, 'StackId': stack_id,
                          'SourceServerId': source_server_id,
                          'LifecycleState': 'ACTIVE', 'Deployments': {}}
              if (document.get('StackId') != stack_id or
                      document.get('SourceServerId') != source_server_id):
                  raise ValueError('InventoryOwnershipMismatch')
              document.setdefault('LifecycleState', 'ACTIVE')
              return document

          def save_inventory(parameter_name, document):
              ssm.put_parameter(
                  Name=parameter_name, Type='String', Overwrite=True,
                  Value=json.dumps(document, separators=(',', ':'), sort_keys=True))

          def describe_session(resource_id):
              try:
                  return ec2.describe_traffic_mirror_sessions(
                      TrafficMirrorSessionIds=[resource_id]
                  ).get('TrafficMirrorSessions', [])
              except Exception as error:
                  if is_not_found(error):
                      return []
                  raise

          def describe_target(resource_id):
              try:
                  return ec2.describe_traffic_mirror_targets(
                      TrafficMirrorTargetIds=[resource_id]
                  ).get('TrafficMirrorTargets', [])
              except Exception as error:
                  if is_not_found(error):
                      return []
                  raise

          def describe_filter(resource_id):
              try:
                  return ec2.describe_traffic_mirror_filters(
                      TrafficMirrorFilterIds=[resource_id]
                  ).get('TrafficMirrorFilters', [])
              except Exception as error:
                  if is_not_found(error):
                      return []
                  raise

          def describe_instance(resource_id):
              try:
                  response = ec2.describe_instances(InstanceIds=[resource_id])
              except Exception as error:
                  if error_code(error) == 'InvalidInstanceID.NotFound':
                      return []
                  raise
              return [item for reservation in response.get('Reservations', [])
                      for item in reservation.get('Instances', [])]

          def describe_group(resource_id):
              try:
                  return ec2.describe_security_groups(
                      GroupIds=[resource_id]).get('SecurityGroups', [])
              except Exception as error:
                  if error_code(error) == 'InvalidGroup.NotFound':
                      return []
                  raise

          def discovery_filters(stack_id, source_server_id):
              return [
                  {'Name': 'tag:StackId', 'Values': [stack_id]},
                  {'Name': 'tag:SourceServerId', 'Values': [source_server_id]}
              ]

          def merge_discovered(deployments, resource, id_key, resource_id,
                               stack_id, source_server_id, label):
              tags = tags_dict(resource)
              if (tags.get('StackId') != stack_id or
                      tags.get('SourceServerId') != source_server_id):
                  raise ValueError(f'OwnershipMismatch:{label}')
              replication_server_id = tags.get('ReplicationServerId')
              if not replication_server_id:
                  raise ValueError(f'MissingReplicationServerId:{label}')
              record = deployments.setdefault(replication_server_id, {})
              existing_id = record.get(id_key)
              if existing_id and existing_id != resource_id:
                  raise ValueError(f'DuplicateOwnedResources:{label}')
              record[id_key] = resource_id

          def discover_owned_resources(inventory, stack_id, source_server_id):
              """Reconstruct missing inventory IDs from atomic create-time tags."""
              deployments = inventory.setdefault('Deployments', {})
              filters = discovery_filters(stack_id, source_server_id)

              groups = ec2.describe_security_groups(
                  Filters=filters).get('SecurityGroups', [])
              # EC2 can return terminated instances for about an hour.
              # Exclude them so a replaced target is not misclassified as a
              # duplicate while retaining every state that cleanup may need.
              instance_filters = filters + [{
                  'Name': 'instance-state-name',
                  'Values': ['pending', 'running', 'shutting-down',
                             'stopping', 'stopped']
              }]
              instances_response = ec2.describe_instances(
                  Filters=instance_filters)
              instances = [
                  item
                  for reservation in instances_response.get('Reservations', [])
                  for item in reservation.get('Instances', [])
              ]
              targets = ec2.describe_traffic_mirror_targets(
                  Filters=filters).get('TrafficMirrorTargets', [])
              mirror_filters = ec2.describe_traffic_mirror_filters(
                  Filters=filters).get('TrafficMirrorFilters', [])
              sessions = ec2.describe_traffic_mirror_sessions(
                  Filters=filters).get('TrafficMirrorSessions', [])

              for resource in groups:
                  merge_discovered(
                      deployments, resource, 'SecurityGroupId',
                      resource['GroupId'], stack_id, source_server_id,
                      'security-group')
              for resource in instances:
                  merge_discovered(
                      deployments, resource, 'TargetInstanceId',
                      resource['InstanceId'], stack_id, source_server_id,
                      'target-instance')
              for resource in targets:
                  merge_discovered(
                      deployments, resource, 'MirrorTargetId',
                      resource['TrafficMirrorTargetId'], stack_id,
                      source_server_id, 'traffic-mirror-target')
              for resource in mirror_filters:
                  merge_discovered(
                      deployments, resource, 'MirrorFilterId',
                      resource['TrafficMirrorFilterId'], stack_id,
                      source_server_id, 'traffic-mirror-filter')
              for resource in sessions:
                  merge_discovered(
                      deployments, resource, 'MirrorSessionId',
                      resource['TrafficMirrorSessionId'], stack_id,
                      source_server_id, 'traffic-mirror-session')
              return inventory

          def remaining_seconds(context):
              return context.get_remaining_time_in_millis() / 1000.0

          def wait_for_verified_termination(instance_id, context):
              for _ in range(30):
                  if remaining_seconds(context) <= 45:
                      raise TimeoutError('TimeBudgetReserved:InstanceTermination')
                  try:
                      response = ec2.describe_instances(InstanceIds=[instance_id])
                  except Exception as error:
                      if error_code(error) == 'InvalidInstanceID.NotFound':
                          return
                      raise
                  states = [
                      item.get('State', {}).get('Name')
                      for reservation in response.get('Reservations', [])
                      for item in reservation.get('Instances', [])
                  ]
                  if not states or all(state == 'terminated' for state in states):
                      return
                  time.sleep(10)
              raise TimeoutError('InstanceTerminationNotVerified')

          def delete_security_group_with_retry(group_id, context):
              for _ in range(12):
                  if remaining_seconds(context) <= 45:
                      raise TimeoutError('TimeBudgetReserved:SecurityGroupDeletion')
                  try:
                      ec2.delete_security_group(GroupId=group_id)
                      return
                  except Exception as error:
                      code = error_code(error)
                      if code == 'InvalidGroup.NotFound':
                          return
                      if code != 'DependencyViolation':
                          raise
                  time.sleep(5)
              raise TimeoutError('SecurityGroupDeletionNotVerified')

          def handler(event, context):
              logger.info("Cleanup requestType=%s requestId=%s",
                          event.get('RequestType'), context.aws_request_id)
              props = event.get('ResourceProperties', {})
              deterministic_id = f"Cleanup-{props.get('SourceServerId', 'unknown')}"
              physical_id = event.get('PhysicalResourceId') or deterministic_id

              if event['RequestType'] != 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                   {'Message': 'No cleanup needed for Create/Update'},
                                   physicalResourceId=physical_id)
                  return

              source_server_id = props['SourceServerId']
              stack_id = props['StackId']
              parameter_name = props['InventoryParameterName']
              lifecycle_parameter_name = props['LifecycleParameterName']
              ownership_parameter_name = props['OwnershipParameterName']
              errors = []
              deleted = []

              try:
                  # This separate guard is monotonic for the lifetime of a delete.
                  # Setup has read-only access and cannot restore it to ACTIVE.
                  ssm.put_parameter(
                      Name=lifecycle_parameter_name, Type='String',
                      Value='DELETING', Overwrite=True)
                  inventory = load_inventory(parameter_name, stack_id,
                                             source_server_id)
                  inventory['LifecycleState'] = 'DELETING'
                  save_inventory(parameter_name, inventory)

                  # An invocation accepted before the EventBridge rule was removed
                  # must finish or observe DELETING and roll back before cleanup.
                  # Fail this delete attempt closed; CloudFormation retry resumes
                  # from the same exact inventory after the invocation clears.
                  active_invocation = inventory.get('ActiveInvocationId')
                  active_expires_at = inventory.get('ActiveInvocationExpiresAt', 0)
                  if active_invocation and active_expires_at > int(time.time()):
                      logger.warning("Cleanup deferred because setup invocation is active")
                      cfnresponse.send(
                          event, context, cfnresponse.FAILED,
                          {'Message': 'Cleanup deferred; retry required',
                           'Deleted': [],
                           'Errors': ['SetupInvocationInProgress']},
                          physicalResourceId=physical_id)
                      return
                  if active_invocation:
                      logger.warning("Expired setup invocation marker cleared")
                      inventory.pop('ActiveInvocationId', None)
                      inventory.pop('ActiveInvocationExpiresAt', None)
                      save_inventory(parameter_name, inventory)

                  # Reconstruct any ID lost in a create-before-persist crash
                  # window before destructive cleanup. Discovery itself is
                  # fail-closed: duplicates, missing identity tags, or API errors
                  # fail the CloudFormation delete and retain the ownership lock.
                  inventory = discover_owned_resources(
                      inventory, stack_id, source_server_id)
                  save_inventory(parameter_name, inventory)
                  deployments = inventory.setdefault('Deployments', {})

                  for replication_server_id, record in list(deployments.items()):
                      # Delete session, target, and filter by exact persisted ID.
                      for key, label, describe, delete in [
                          ('MirrorSessionId', 'Session', describe_session,
                           lambda rid: ec2.delete_traffic_mirror_session(
                               TrafficMirrorSessionId=rid)),
                          ('MirrorTargetId', 'Target', describe_target,
                           lambda rid: ec2.delete_traffic_mirror_target(
                               TrafficMirrorTargetId=rid)),
                          ('MirrorFilterId', 'Filter', describe_filter,
                           lambda rid: ec2.delete_traffic_mirror_filter(
                               TrafficMirrorFilterId=rid))
                      ]:
                          resource_id = record.get(key)
                          if not resource_id:
                              continue
                          try:
                              resources = describe(resource_id)
                              if resources:
                                  verify_owned(resources[0], stack_id,
                                               source_server_id,
                                               replication_server_id, label)
                                  delete(resource_id)
                                  deleted.append(f'{label}: {resource_id}')
                              record.pop(key, None)
                              save_inventory(parameter_name, inventory)
                          except Exception as error:
                              errors.append(f'{label} {resource_id}: {safe_error(error)}')

                      instance_id = record.get('TargetInstanceId')
                      if instance_id:
                          try:
                              instances = describe_instance(instance_id)
                              if instances and instances[0].get('State', {}).get('Name') != 'terminated':
                                  verify_owned(instances[0], stack_id,
                                               source_server_id,
                                               replication_server_id,
                                               'target-instance')
                                  ec2.terminate_instances(InstanceIds=[instance_id])
                                  wait_for_verified_termination(instance_id, context)
                                  deleted.append(f'Instance: {instance_id}')
                              record.pop('TargetInstanceId', None)
                              record.pop('TargetNetworkInterfaceId', None)
                              record.pop('TargetLaunchToken', None)
                              save_inventory(parameter_name, inventory)
                          except Exception as error:
                              errors.append(f'Instance {instance_id}: {safe_error(error)}')

                      group_id = record.get('SecurityGroupId')
                      if group_id:
                          try:
                              groups = describe_group(group_id)
                              if groups:
                                  verify_owned(groups[0], stack_id,
                                               source_server_id,
                                               replication_server_id,
                                               'security-group')
                                  delete_security_group_with_retry(group_id, context)
                                  deleted.append(f'SecurityGroup: {group_id}')
                              record.pop('SecurityGroupId', None)
                              save_inventory(parameter_name, inventory)
                          except Exception as error:
                              errors.append(f'SecurityGroup {group_id}: {safe_error(error)}')

                      if not any(key.endswith('Id') for key in record):
                          deployments.pop(replication_server_id, None)
                          save_inventory(parameter_name, inventory)

                  if deployments and not errors:
                      errors.append('OwnedResourcesRemainAfterCleanup')

                  # Retain the cross-stack lock until every owned resource has
                  # been removed. A failed delete remains safely non-reclaimable.
                  if not errors:
                      try:
                          release_source_lock(
                              ownership_parameter_name, stack_id)
                      except Exception as error:
                          errors.append(
                              f'OwnershipLock: {safe_error(error)}')

                  result = {
                      'Message': ('Cleanup completed' if not errors else
                                  'Cleanup incomplete; retry required'),
                      'Deleted': deleted,
                      'Errors': errors
                  }
                  logger.info("Cleanup completed deletedCount=%d errorCount=%d",
                              len(deleted), len(errors))
                  cfnresponse.send(
                      event, context,
                      cfnresponse.FAILED if errors else cfnresponse.SUCCESS,
                      result, physicalResourceId=physical_id)

              except Exception as error:
                  details = safe_error(error)
                  logger.error("Cleanup failed requestId=%s details=%s",
                               context.aws_request_id, details)
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED,
                      {'Message': 'Cleanup failed', 'Deleted': deleted,
                       'Errors': [details]},
                      physicalResourceId=physical_id)

  CleanupResource:
    Type: Custom::Cleanup
    DependsOn:
      - MirroringLambdaFunction
    Properties:
      ServiceToken: !GetAtt CleanupFunction.Arn
      # Covers the 300-second function plus Lambda's two asynchronous retries,
      # while bounding a missing-response wait below the one-hour default.
      ServiceTimeout: 1200
      ReplicationService: !Ref ReplicationService
      SourceServerId: !Ref SourceServerId
      StackId: !Ref AWS::StackId
      InventoryParameterName: !Ref MirroringInventoryParameter
      LifecycleParameterName: !Ref MirroringLifecycleParameter
      OwnershipParameterName: !If
        - MgnReplicationService
        - !Sub "/vpc-traffic-mirroring/ownership/mgn/${SourceServerId}"
        - !Sub "/vpc-traffic-mirroring/ownership/drs/${SourceServerId}"

  #============================================================================
  # STEP 6: EventBridge Rule - Trigger on EC2 Running State
  #============================================================================
  
  MirroringEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CleanupResource
      - MirroringEventBridgeDLQPolicy
    Properties:
      Name: !Sub "${AWS::StackName}-RSMirroringRule"
      Description: !Sub "Detect replication server for source ${SourceServerId}"
      EventPattern:
        detail-type:
          - "EC2 Instance State-change Notification"
        source:
          - "aws.ec2"
        detail:
          state:
            - "running"
      State: "ENABLED"
      Targets:
        - Arn: !GetAtt MirroringLambdaFunction.Arn
          Id: "MirroringLambdaTarget"
          DeadLetterConfig:
            Arn: !GetAtt MirroringEventBridgeDLQ.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 2

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MirroringLambdaFunction
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt MirroringEventRule.Arn

  MirroringFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Mirroring Lambda reported an execution error"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MirroringLambdaFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmNotificationsEnabled
        - - !Ref AlarmNotificationTopicArn
        - []
      OKActions: []
      InsufficientDataActions: []

  MirroringFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Mirroring Lambda experienced more than five throttles in five minutes"
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref MirroringLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmNotificationsEnabled
        - - !Ref AlarmNotificationTopicArn
        - []
      OKActions: []
      InsufficientDataActions: []

  MirroringDLQMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "The mirroring Lambda dead-letter queue contains failed events"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MirroringDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmNotificationsEnabled
        - - !Ref AlarmNotificationTopicArn
        - []
      OKActions: []
      InsufficientDataActions: []

  MirroringEventBridgeDLQMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "The EventBridge target DLQ contains undelivered events"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MirroringEventBridgeDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmNotificationsEnabled
        - - !Ref AlarmNotificationTopicArn
        - []
      OKActions: []
      InsufficientDataActions: []

  MirroringEventBridgeDLQDeliveryFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "EventBridge failed to write an undelivered event to its target DLQ"
      Namespace: AWS/Events
      MetricName: InvocationsFailedToBeSentToDLQ
      Dimensions:
        - Name: RuleName
          Value: !Ref MirroringEventRule
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmNotificationsEnabled
        - - !Ref AlarmNotificationTopicArn
        - []
      OKActions: []
      InsufficientDataActions: []

  MirroringEventBridgeFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "EventBridge failed to invoke the mirroring Lambda"
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref MirroringEventRule
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmNotificationsEnabled
        - - !Ref AlarmNotificationTopicArn
        - []
      OKActions: []
      InsufficientDataActions: []

#==============================================================================
# OUTPUTS
#==============================================================================

Outputs:
  SourceServerId:
    Description: "Source server configured for traffic mirroring"
    Value: !Ref SourceServerId

  ReplicationService:
    Description: "Replication service in use"
    Value: !Ref ReplicationService

  MirroringTagAdded:
    Description: "Tags added to source server's replication settings"
    Value: !Sub "Mirroring-${SourceServerId}=yes; MirroringStackId=${AWS::StackId}"

  StackOwnershipId:
    Description: "Unique ownership ID used to isolate this stack's mirroring resources"
    Value: !Ref AWS::StackId

  LambdaLogGroup:
    Description: "CloudWatch Logs for monitoring"
    Value: !Sub "/aws/lambda/${AWS::StackName}-MirroringFunction"

  MirroringInventoryParameterName:
    Description: "Stack-owned durable inventory of exact mirroring resource IDs"
    Value: !Ref MirroringInventoryParameter

  MirroringDeadLetterQueueNames:
    Description: "Lambda processing DLQ and EventBridge target delivery DLQ"
    Value: !Join
      - ", "
      - - !GetAtt MirroringDLQ.QueueName
        - !GetAtt MirroringEventBridgeDLQ.QueueName

  MirroringAlarmNames:
    Description: "CloudWatch alarms for Lambda errors/throttles, both DLQs, and EventBridge failures"
    Value: !Join
      - ", "
      - - !Ref MirroringFunctionErrorsAlarm
        - !Ref MirroringFunctionThrottlesAlarm
        - !Ref MirroringDLQMessagesAlarm
        - !Ref MirroringEventBridgeDLQMessagesAlarm
        - !Ref MirroringEventBridgeDLQDeliveryFailuresAlarm
        - !Ref MirroringEventBridgeFailuresAlarm

  AlarmNotificationConfiguration:
    Description: "SNS alarm notification configuration"
    Value: !If
      - AlarmNotificationsEnabled
      - !Sub "Enabled: ${AlarmNotificationTopicArn}"
      - "Disabled: inspect alarms in the CloudWatch console"

  CleanupInstructions:
    Description: "How to clean up"
    Value: !Sub |
      This stack refuses deployment when another StackId already owns the source server
      replication setting. On deletion, it removes the source marker and ownership tag only
      if the setting still carries this stack's exact StackId; externally changed ownership
      is left unchanged. Cleanup removes this stack's traffic mirror session, target, filter,
      mirror target instance, security groups, both DLQs, Lambda functions, IAM roles,
      EventBridge rule, alarms, inventory, and log groups. The service-managed replication
      server is never terminated by this stack; AWS Transform MGN / AWS DRS reclaims it
      through the service lifecycle after the unique replication settings are removed.
