                      )
                  
                      target_instance_id = response['Instances'][0]['InstanceId']
                      created_this_attempt.append(('target-instance', target_instance_id))
                  inventory_record['TargetInstanceId'] = target_instance_id
                  inventory_record.pop('TargetLaunchToken', None)
                  save_inventory(inventory_parameter, inventory_document)
                  wait_for_instance_running(target_instance_id, context)
                  require_time(context, 90, 'PostLaunchStabilization')
                  time.sleep(10)
                  target_details = get_instance_details(target_instance_id)
                  
                  # Create or reuse the exact owned mirror target.
                  mirror_target = find_mirror_target(
                      inventory_record.get('MirrorTargetId'), stack_id,
                      expected_source_server, instance_id,
                      target_details['network_interface_id'])
                  if not mirror_target:
                      ensure_active(inventory_parameter)
                      require_time(context, 60, 'MirrorTargetCreation')
                      response = ec2.create_traffic_mirror_target(
                          NetworkInterfaceId=target_details['network_interface_id'],
                          Description=f'Mirror target for source server {expected_source_server}',
                          TagSpecifications=[{
